name: Deploy to Ubuntu Server with SSH
on:
  push:
    branches:
      - master
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup SSH
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.SSH_PRIVATE_KEY }}

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 'latest'

      - name: Install dependencies and build
        run: |
          npm install
          npm run build

      - name: Deploy
        run: |
          scp -r .svelte-kit/output/* ${{ secrets.SSH_USER }}@${{ secrets.SSH_SERVER_IP }}:/var/www/html/
